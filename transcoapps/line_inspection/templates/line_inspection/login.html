<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Line Inspection</title>
<style>
  :root { --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9; --blue: #2a78d6; --blue-600: #184f95; --crit: #d03b3b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--page); color: var(--ink); margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--surface); border: 1px solid var(--grid); border-radius: 12px; padding: 28px 32px; width: 380px; max-width: 92vw; box-shadow: 0 12px 40px rgba(11,11,11,.10); }
  h1 { font-size: 19px; margin: 0 0 4px; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin: 12px 0 4px; }
  input { width: 100%; padding: 8px 10px; border: 1px solid var(--muted); border-radius: 8px; font: inherit; font-size: 14px; }
  .btn-primary { width: 100%; margin-top: 18px; padding: 10px; font-size: 14px; background: var(--blue); border: 1px solid var(--blue); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .btn-primary:hover { background: var(--blue-600); }
  .error { background: #fdeeee; color: var(--crit); border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 10px; }
  .links { margin-top: 14px; font-size: 12px; text-align: center; }
  .links a { color: var(--blue-600); text-decoration: none; }
</style>
</head>
<body>
  <form class="card" method="post">
    {% csrf_token %}
    <h1>APTRANSCO · Line Inspection</h1>
    <p class="sub">Sign in with your employee id and password</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Employee ID</label>
    <input type="text" name="user_id" value="{{ user_id }}" autofocus required>
    <label>Password</label>
    <input type="password" name="passwd" required>
    <button class="btn-primary" type="submit">Sign in</button>
    <div class="links"><a href="{% url 'line_inspection:forgot-password' %}">Forgot password?</a></div>
  </form>
</body>
</html>
