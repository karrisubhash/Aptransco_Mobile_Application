name: drone_inspection_app
description: "APTRANSCO drone inspection data collection app with offline upload queue support."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+2

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  # Password hashing for offline sign-in (PBKDF2-HMAC-SHA256). Already present
  # transitively; named here because we import it directly.
  crypto: ^3.0.7
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  geolocator: ^14.0.3
  path_provider: ^2.1.6
  path: ^1.9.1

  # Hands a downloaded report (History / Tickets → Excel, PDF) to the OS share
  # sheet, which is what lets the engineer save it to Files/Drive or send it on.
  # See services/li_export.dart: the file itself is written to the app's own
  # directory, so no storage permission is involved on any Android version.
  # 13.x deliberately: every share_plus below it pins `win32 ^5.5.3`, which
  # cannot co-exist with the `win32 ^6` that geolocator 14 pulls in through
  # geolocator_linux → package_info_plus. 12.x fails version solving outright.
  share_plus: ^13.3.0

  # Runtime dependency (not dev-only): main.dart calls
  # FlutterNativeSplash.preserve()/.remove() to hold the native launch screen
  # up until the first Flutter frame is fully ready, so there's no blank gap
  # between it and WelcomeScreen.
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon (AP TRANSCO mark). Regenerate after changing the source:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#17457F"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"

# Splash shown at app opening: the full-screen APtransco_app.png welcome
# artwork, which is the same design WelcomeScreen renders live — so the native
# launch screen and the first Flutter frame look identical and the handoff is
# invisible. Regenerate with:
#   dart run flutter_native_splash:create
#
# Two deliberate omissions, both load-bearing:
#  - no `color`: _createBackground() prefers color over background_image and
#    would silently ignore the artwork entirely (flutter_native_splash/ios.dart).
#  - no `image`: that layer is drawn android:gravity="center" ON TOP of the
#    background, which would stamp a second logo over the artwork.
# background_image is the only key drawn android:gravity="fill" / iOS
# contentMode="scaleToFill", i.e. actually full-screen.
flutter_native_splash:
  background_image: assets/branding/APtransco_app.png
  # Android 12+ ignores all of the above: the platform SplashScreen API only
  # accepts a background colour plus a centre-masked icon, so a full-screen
  # launch image is impossible there. The icon stays the AP TRANSCO mark on
  # white — which is exactly the artwork's own top-of-screen logo on its own
  # near-white background, so it reads as that logo settling into place rather
  # than as a different screen.
  android_12:
    image: assets/branding/android12_logo.png
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
flutter:
  uses-material-design: true

  assets:
    - assets/data/transmission_lines.json
    - assets/data/tower_locations.json
    - assets/certs/corp_ca.pem
    - assets/branding/logo_mark.png
    - assets/branding/logo_full.png